<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>おにごっこ だっしゅつ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic",system-ui,sans-serif;background:#fff6e0;color:#3b2a1a;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:14px}
h1{font-size:26px;margin:6px 0 12px;text-align:center}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 0 #e8d7b0}
label{display:block;font-weight:700;margin-bottom:6px}
select,input{width:100%;font-size:20px;padding:12px;border-radius:12px;border:3px solid #e8c77a;background:#fffdf5;font-family:inherit}
button{width:100%;font-size:20px;font-weight:700;padding:14px;border:0;border-radius:14px;background:#ff6a3d;color:#fff;box-shadow:0 4px 0 #c24520;margin-top:10px;font-family:inherit}
button.sub{background:#4aa8e8;box-shadow:0 4px 0 #2b78ae}
button:disabled{opacity:.4}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c24520}
.hidden{display:none!important}
#code{font-size:48px;font-weight:900;text-align:center;letter-spacing:8px;color:#ff6a3d}
#plist{list-style:none;padding:0;margin:8px 0;font-size:20px}
#plist li{padding:6px 10px;margin:4px 0;background:#fff3c8;border-radius:10px}
#err{color:#d12;font-weight:700;text-align:center;min-height:22px}
#hud{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin-bottom:6px}
#cv{width:100%;aspect-ratio:1/1;display:block;border-radius:16px;touch-action:none;background:#fdf1cf}
#result{position:fixed;inset:0;background:rgba(40,25,10,.78);display:flex;align-items:center;justify-content:center;padding:18px}
#result .card{width:100%;max-width:420px}
#rtitle{font-size:28px;font-weight:900;text-align:center;margin:0 0 8px}
.small{font-size:14px;color:#7a6548;text-align:center}
#qr{display:flex;justify-content:center;margin:10px 0}
#qr svg{width:min(70vw,260px);height:auto;background:#fff;border-radius:12px;padding:8px}
</style>
</head>
<body>
<div id="app">
  <h1>👹 おにごっこ だっしゅつ</h1>
  <div id="err"></div>

  <section id="s-home">
    <div class="card">
      <label for="name">なまえを えらぶ</label>
      <select id="name"></select>
    </div>
    <div class="card" id="c-create">
      <button id="create">へやを つくる</button>
    </div>
    <div class="card hidden" id="c-join">
      <input id="joincode" type="hidden">
      <button id="join" class="sub">へやに はいる</button>
    </div>
  </section>

  <section id="s-lobby" class="hidden">
    <div class="card">
      <div class="small">みんなを よぼう！</div>
      <div id="qr"></div>
      <div class="small">ほかの ひとは スマホの カメラで この QR を よみとってね</div>
      <button id="copy" class="sub">リンクを おくる・コピー</button>
    </div>
    <div class="card">
      <label>いる ひと（2〜6にん）</label>
      <ul id="plist"></ul>
      <button id="ready" class="sub">じゅんび OK！</button>
      <button id="start">スタート！</button>
      <div class="small">みんなが じゅんび OK に なったら スタート！ おには ランダムで きまるよ。おにから にげて、みぎしたの 🚪 に はいれば だっしゅつ！</div>
    </div>
  </section>

  <section id="s-game" class="hidden">
    <div id="hud"><span id="role"></span><span id="timer"></span></div>
    <canvas id="cv"></canvas>
    <div class="small">がめんを ゆびで なぞると うごくよ</div>
  </section>
</div>

<div id="result" class="hidden">
  <div class="card">
    <p id="rtitle"></p>
    <ul id="rlist" style="list-style:none;padding:0;font-size:20px"></ul>
    <button id="again">もういちど</button>
  </div>
</div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';

  try{
    app=initializeApp(firebaseConfig);
    const auth=getAuth(app);

  await ready; if(!db)return;
  err("");
  try{
    for(let i=0;i<5;i++){
      const code=String(1000+Math.floor(Math.random()*9000));
      const s=await get(ref(db,`rooms/${code}/meta`));

  if(!meta)return;
  if(meta.state==="lobby"){ if(mode!=="lobby")toLobby(); renderLobby(); }
  else if(meta.state==="play" && meta.round!==playedRound){ startGame(); }
}
function toLobby(){
  mode="lobby"; me={x:0,y:0,st:"run"};
  update(ref(db,`rooms/${room}/players/${uid}`),{x:0,y:0,st:"run",ready:false});
  $("result").classList.add("hidden"); show("s-lobby"); drawQR();
}
function drawQR(){
  const url=location.origin+location.pathname+"?room="+room;
  const box=$("qr"); box.innerHTML="";
  try{
    const qr=qrcode(0,"M"); qr.addData(url); qr.make();
    box.innerHTML=qr.createSvgTag({cellSize:4,margin:2,scalable:true});
  }catch(e){box.textContent="（QRが だせなかったよ。したの ボタンで リンクを おくってね）"}
}
function renderLobby(){
  const ids=Object.keys(players);
  $("plist").innerHTML=ids.map(i=>`<li>${players[i].ready?"✅ ":(i===uid?"👉 ":"🙂 ")}${esc(players[i].name)}${players[i].ready?"　じゅんび OK":""}</li>`).join("");
  const mine=!!(players[uid]&&players[uid].ready), all=ids.length>=2&&ids.every(i=>players[i].ready);
  $("ready").textContent=mine?"じゅんび やめる":"じゅんび OK！";
  $("start").disabled=!all;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- ゲーム ----------
function startGame(){
  playedRound=meta.round; oniUid=meta.oni; startAt=meta.startAt; mode="play";
  roster=Object.keys(players).sort(); disp={};
  const runners=roster.filter(i=>i!==oniUid);
  if(uid===oniUid){me={x:500,y:520,st:"run"}}
  else{const k=runners.indexOf(uid);me={x:60,y:80+k*140,st:"run"}}
  lastSend=0; lastFrame=performance.now();
  send(true);
  show("s-game"); $("result").classList.add("hidden");
  $("role").textContent=uid===oniUid?"👹 きみは おに！":"🏃 にげろ！ 🚪へ！";
  resize(); requestAnimationFrame(loop);
}
function send(force){
  const t=performance.now();
  if(!force && t-lastSend<100)return; lastSend=t;
  update(ref(db,`rooms/${room}/players/${uid}`),{x:Math.round(me.x),y:Math.round(me.y),st:me.st});
}

const cv=$("cv"), ctx=cv.getContext("2d");
let scale=1;
function resize(){
  const s=Math.min($("app").clientWidth-28,520); const d=window.devicePixelRatio||1;
  cv.width=cv.height=Math.round(s*d); scale=cv.width/W;
}
addEventListener("resize",()=>{if(mode==="play"||mode==="result")resize()});

// そうさ
let drag=null, vec={x:0,y:0}; const keys={};
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};vec={x:0,y:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,l=Math.hypot(dx,dy);vec=l>8?{x:dx/l,y:dy/l}:{x:0,y:0}; if(l>60){drag.x=e.clientX-dx/l*60;drag.y=e.clientY-dy/l*60}});
const endDrag=()=>{drag=null;vec={x:0,y:0}};
cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);
addEventListener("keydown",e=>keys[e.key]=true); addEventListener("keyup",e=>keys[e.key]=false);
function inputVec(){
  let x=vec.x,y=vec.y;
  if(keys.ArrowLeft||keys.a)x-=1; if(keys.ArrowRight||keys.d)x+=1;
  if(keys.ArrowUp||keys.w)y-=1; if(keys.ArrowDown||keys.s)y+=1;
  const l=Math.hypot(x,y); return l>1?{x:x/l,y:y/l}:{x,y};
}

function hits(x,y,r){
  if(x<r||y<r||x>W-r||y>W-r)return true;
  for(const [rx,ry,rw,rh] of WALLS){
    const cx=Math.max(rx,Math.min(x,rx+rw)), cy=Math.max(ry,Math.min(y,ry+rh));
    if(Math.hypot(x-cx,y-cy)<r)return true;
  }
  return false;
}
function step(dt){
  const v=inputVec(); const isOni=uid===oniUid;
  const sp=(isOni?SPEED_ONI:SPEED_RUN)*dt, r=isOni?RO:R;
  const nx=me.x+v.x*sp; if(!hits(nx,me.y,r))me.x=nx;
  const ny=me.y+v.y*sp; if(!hits(me.x,ny,r))me.y=ny;
}

function loop(t){
  if(mode!=="play"&&mode!=="result")return;
  const dt=Math.min(0.05,(t-lastFrame)/1000); lastFrame=t;
  const now=nowS(), el=(now-startAt)/1000;

  if(mode==="play"){
    const isOni=uid===oniUid;
    if(el>=0){
      const canMove=me.st==="run" && !(isOni && el<FREEZE);
      if(canMove)step(dt);
      if(!isOni && me.st==="run"){
        const o=players[oniUid];
        if(o && Math.hypot(o.x-me.x,o.y-me.y)<R+RO-4){me.st="caught";send(true)}
        else if(me.x>EXIT[0]&&me.y>EXIT[1]){me.st="escaped";send(true)}
      }
      send();
    }
    // おわり判定
    if(el>=0){
      const runners=roster.filter(i=>i!==oniUid&&players[i]);
      const active=runners.filter(i=>(i===uid?me.st:players[i].st)==="run");
      const oniGone=!players[oniUid];
      if(el>=TIME||active.length===0||oniGone){finish(oniGone);}
    }
    $("timer").textContent=el<0?"⏳":"⏱ "+Math.max(0,Math.ceil(TIME-el));
  }
  draw(el);
  requestAnimationFrame(loop);
}

function finish(oniGone){
  mode="result"; send(true);
  const runners=roster.filter(i=>i!==oniUid&&players[i]);
  const st=i=>i===uid?me.st:players[i].st;
  const esc_=runners.filter(i=>st(i)==="escaped").length;
  $("rtitle").textContent=oniGone?"おにが いなくなった！":(esc_>0?`🎉 ${esc_}にん だっしゅつ！`:"👹 おにの かち！");
  const mark=s=>s==="escaped"?"🚪 だっしゅつ！":s==="caught"?"😱 つかまった":"⏰ じかんぎれ";
  $("rlist").innerHTML=
    `<li>👹 ${esc(players[oniUid]?players[oniUid].name:"おに")}（おに）</li>`+
    runners.map(i=>`<li>${esc(players[i].name)}　${mark(st(i))}</li>`).join("");
  $("result").classList.remove("hidden");
}

function draw(el){
  const c=ctx, s=scale; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height);
  c.fillStyle="#fdf1cf"; c.fillRect(0,0,cv.width,cv.height);
  c.scale(s,s);
  // 出口
  c.fillStyle="#7ad6c4"; c.fillRect(...EXIT);
  c.font="64px sans-serif"; c.textAlign="center"; c.textBaseline="middle"; c.fillText("🚪",EXIT[0]+60,EXIT[1]+62);
  // かべ
  c.fillStyle="#9a7b57"; for(const w of WALLS)c.fillRect(...w);
  // キャラ
  for(const id of roster){
    const p=players[id]; if(!p&&id!==uid)continue;
    let x,y,st;
    if(id===uid){x=me.x;y=me.y;st=me.st}
    else{
      const d=disp[id]||(disp[id]={x:p.x,y:p.y});
      d.x+=(p.x-d.x)*0.35; d.y+=(p.y-d.y)*0.35; x=d.x;y=d.y;st=p.st;
    }
    if(st==="escaped")continue;
    const isOni=id===oniUid, col=isOni?"#e8412e":COLORS[roster.indexOf(id)%COLORS.length];
    c.globalAlpha=st==="caught"?0.35:1;
    drawChar(x,y,isOni,col,id===uid,p?p.name:"");
    c.globalAlpha=1;
  }
  // カウントダウン
  c.textAlign="center"; c.textBaseline="middle";
  if(el<0){
    c.fillStyle="rgba(0,0,0,.45)"; c.fillRect(0,0,W,W);
    c.fillStyle="#fff"; c.font="bold 200px sans-serif"; c.fillText(String(Math.ceil(-el)),W/2,W/2);
  }else if(el<FREEZE && mode==="play"){
    c.fillStyle="#fff"; c.strokeStyle="#3b2a1a"; c.lineWidth=8; c.font="bold 54px sans-serif";
    const t=uid===oniUid?`おには あと ${Math.ceil(FREEZE-el)}びょう まってね`:`いまのうちに にげて！`;
    c.strokeText(t,W/2,70); c.fillText(t,W/2,70);
  }
}
function drawChar(x,y,isOni,col,isMe,name){
  const c=ctx, r=isOni?RO:R;
  if(isMe){c.beginPath();c.arc(x,y,r+8,0,7);c.strokeStyle="#ffd400";c.lineWidth=5;c.stroke()}
  c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=col;c.fill();
  c.lineWidth=3;c.strokeStyle="#3b2a1a";c.stroke();
  if(isOni){ // つの
    c.fillStyle="#fff7c0";
    for(const sx of [-1,1]){c.beginPath();c.moveTo(x+sx*6,y-r+4);c.lineTo(x+sx*14,y-r-14);c.lineTo(x+sx*16,y-r+6);c.closePath();c.fill();c.stroke()}
  }
  // め
  c.fillStyle="#fff";
  for(const sx of [-1,1]){c.beginPath();c.arc(x+sx*r*0.38,y-r*0.15,r*0.22,0,7);c.fill()}
  c.fillStyle="#222";
  for(const sx of [-1,1]){c.beginPath();c.arc(x+sx*r*0.38,y-r*0.15,r*0.1,0,7);c.fill()}
  if(isOni){ // いかりまゆ と きば
    c.strokeStyle="#222";c.lineWidth=3;
    for(const sx of [-1,1]){c.beginPath();c.moveTo(x+sx*r*0.7,y-r*0.55);c.lineTo(x+sx*r*0.12,y-r*0.35);c.stroke()}
    c.fillStyle="#fff";
    for(const sx of [-1,1]){c.beginPath();c.moveTo(x+sx*7,y+r*0.35);c.lineTo(x+sx*3,y+r*0.35+9);c.lineTo(x+sx*11,y+r*0.35);c.fill()}
  }else{
    c.strokeStyle="#222";c.lineWidth=2.5;c.beginPath();c.arc(x,y+r*0.15,r*0.3,0.15*Math.PI,0.85*Math.PI);c.stroke();
  }
  c.font="bold 22px sans-serif";c.textAlign="center";c.textBaseline="alphabetic";
  c.lineWidth=5;c.strokeStyle="#fff";c.fillStyle="#3b2a1a";
  c.strokeText(name,x,y-r-(isOni?20:10));c.fillText(name,x,y-r-(isOni?20:10));
}
</script>
</body>
</html>
